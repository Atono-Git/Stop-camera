<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>カメラ一時停止</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow: hidden;
    }


    #app {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #000;
    }


    /* =========================
       カメラエリア
       ========================= */

    #cameraArea {
      position: relative;

      flex: 1;
      min-height: 0;

      background: #000;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /*
     * カメラ映像
     *
     * transformで確実に拡大する
     */

    #camera {
      display: none;

      width: 100%;
      height: 100%;

      object-fit: contain;

      transform-origin: center center;

      will-change: transform;
    }


    /*
     * 一時停止画像
     */

    #frozenImage {
      display: none;

      width: 100%;
      height: 100%;

      object-fit: contain;

      transform-origin: center center;

      will-change: transform;
    }


    /* =========================
       ステータス
       ========================= */

    #status {
      position: absolute;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      padding: 8px 15px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.7);

      font-size: 14px;

      z-index: 30;

      white-space: nowrap;
    }


    /* =========================
       カメラOFF
       ========================= */

    #cameraOffButton {
      display: none;

      position: absolute;

      top: 15px;
      right: 15px;

      padding: 12px 16px;

      border: none;

      border-radius: 12px;

      background: rgba(25, 25, 25, 0.9);

      color: #fff;

      font-size: 15px;
      font-weight: 600;

      z-index: 30;
    }


    /* =========================
       ズームパネル
       ========================= */

    #zoomPanel {
      display: none;

      position: absolute;

      left: 15px;
      bottom: 20px;

      width: calc(100% - 30px);

      padding: 12px 16px;

      border-radius: 16px;

      background: rgba(15, 15, 15, 0.88);

      backdrop-filter: blur(10px);

      z-index: 30;
    }


    #zoomTop {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 8px;
    }


    #zoomTitle {
      font-size: 14px;

      color: #ccc;
    }


    #zoomValue {
      font-size: 20px;

      font-weight: 700;
    }


    /*
     * 横向きスライダー
     *
     * 1倍 ←→ 5倍
     */

    #zoomSlider {
      display: block;

      width: 100%;

      height: 36px;

      margin: 0;

      accent-color: #fff;

      cursor: pointer;
    }


    #zoomLabels {
      display: flex;

      justify-content: space-between;

      color: #aaa;

      font-size: 12px;

      margin-top: 2px;
    }


    /* =========================
       エラー
       ========================= */

    #error {
      display: none;

      position: absolute;

      left: 20px;
      right: 20px;

      top: 50%;

      transform: translateY(-50%);

      padding: 20px;

      border-radius: 14px;

      background: #222;

      color: #fff;

      text-align: center;

      line-height: 1.6;

      white-space: pre-line;

      z-index: 100;
    }


    /* =========================
       操作ボタン
       ========================= */

    #controls {
      flex-shrink: 0;

      display: flex;

      gap: 10px;

      justify-content: center;

      padding: 12px;

      padding-bottom:
        calc(12px + env(safe-area-inset-bottom));

      background: #111;
    }


    button {
      min-height: 52px;

      padding: 10px 18px;

      border: none;

      border-radius: 14px;

      color: #fff;

      background: #292929;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    button:active {
      transform: scale(0.97);
    }


    #startButton {
      background: #16a34a;

      min-width: 200px;
    }


    #pauseButton {
      display: none;

      background: #2563eb;

      flex: 1;

      max-width: 240px;
    }


    #resumeButton {
      display: none;

      background: #2563eb;

      flex: 1;

      max-width: 240px;
    }


    #cameraOffBottomButton {
      display: none;

      background: #333;

      flex: 1;

      max-width: 180px;
    }


    /* =========================
       説明
       ========================= */

    #info {
      flex-shrink: 0;

      display: flex;

      justify-content: space-between;

      gap: 12px;

      padding: 8px 15px;

      background: #000;

      border-top: 1px solid #333;

      color: #aaa;

      font-size: 12px;
    }


    #info span {
      white-space: nowrap;
    }


    /* =========================
       小さい画面
       ========================= */

    @media (max-width: 600px) {

      #cameraOffButton {
        font-size: 14px;

        padding: 10px 13px;
      }


      #zoomPanel {
        bottom: 12px;
      }


      #controls {
        padding-left: 8px;
        padding-right: 8px;
      }


      button {
        font-size: 14px;

        padding-left: 10px;
        padding-right: 10px;
      }


      #info {
        font-size: 10px;
      }

    }

  </style>
</head>


<body>

<div id="app">


  <!-- =========================
       カメラ表示エリア
       ========================= -->

  <div id="cameraArea">


    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>


    <canvas
      id="frozenImage"
    ></canvas>


    <div id="status">
      カメラを開始してください
    </div>


    <button
      id="cameraOffButton"
      type="button"
    >
      ⛔ カメラを切る
    </button>


    <!-- =========================
         ズーム
         ========================= -->

    <div id="zoomPanel">

      <div id="zoomTop">

        <span id="zoomTitle">
          🔍 ズーム
        </span>

        <span id="zoomValue">
          1.0x
        </span>

      </div>


      <input
        id="zoomSlider"
        type="range"
        min="1"
        max="5"
        step="0.1"
        value="1"
      >


      <div id="zoomLabels">

        <span>1.0x</span>

        <span>2x</span>

        <span>3x</span>

        <span>4x</span>

        <span>5.0x</span>

      </div>

    </div>


    <div id="error"></div>

  </div>


  <!-- =========================
       ボタン
       ========================= -->

  <div id="controls">


    <button
      id="startButton"
      type="button"
    >
      📷 カメラ開始
    </button>


    <button
      id="cameraOffBottomButton"
      type="button"
    >
      ⛔ カメラを切る
    </button>


    <button
      id="pauseButton"
      type="button"
    >
      ⏸ 一時停止
    </button>


    <button
      id="resumeButton"
      type="button"
    >
      ▶ 再開
    </button>


  </div>


  <!-- =========================
       説明
       ========================= -->

  <div id="info">

    <span>
      🎤 マイクにはアクセスしていません
    </span>

    <span>
      🔒 写真は保存されません
    </span>

  </div>


</div>


<script>

  /* =========================
     要素
     ========================= */

  const camera =
    document.getElementById("camera");

  const frozenImage =
    document.getElementById("frozenImage");

  const cameraArea =
    document.getElementById("cameraArea");

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");

  const startButton =
    document.getElementById("startButton");

  const cameraOffButton =
    document.getElementById("cameraOffButton");

  const cameraOffBottomButton =
    document.getElementById("cameraOffBottomButton");

  const pauseButton =
    document.getElementById("pauseButton");

  const resumeButton =
    document.getElementById("resumeButton");

  const zoomPanel =
    document.getElementById("zoomPanel");

  const zoomSlider =
    document.getElementById("zoomSlider");

  const zoomValue =
    document.getElementById("zoomValue");


  /* =========================
     状態
     ========================= */

  let stream = null;

  let videoTrack = null;

  let isPaused = false;

  let currentZoom = 1;


  /* =========================
     エラー
     ========================= */

  function showError(message) {

    error.textContent = message;

    error.style.display = "block";
  }


  function hideError() {

    error.style.display = "none";
  }


  /* =========================
     ズーム表示
     ========================= */

  function updateZoomDisplay() {

    const zoom =
      Number(currentZoom);

    zoomValue.textContent =
      zoom.toFixed(1) + "x";


    /*
     * ここが今回の重要部分。
     *
     * カメラのズーム機能は使わず、
     * 映像そのものを拡大する。
     */

    if (!isPaused) {

      camera.style.transform =
        "scale(" + zoom + ")";

    } else {

      frozenImage.style.transform =
        "scale(" + zoom + ")";

    }

  }


  /* =========================
     スライダー
     ========================= */

  zoomSlider.addEventListener(
    "input",
    function () {

      currentZoom =
        Number(this.value);


      if (
        !Number.isFinite(currentZoom)
      ) {
        currentZoom = 1;
      }


      currentZoom =
        Math.max(
          1,
          Math.min(
            5,
            currentZoom
          )
        );


      updateZoomDisplay();

    }
  );


  /* =========================
     カメラ開始
     ========================= */

  async function startCamera() {

    hideError();


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showError(
        "このブラウザではカメラを使用できません。"
      );

      return;
    }


    try {

      /*
       * videoだけ。
       *
       * audio:falseなので
       * マイクにはアクセスしない。
       */

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


      camera.srcObject =
        stream;


      await camera.play();


      videoTrack =
        stream.getVideoTracks()[0];


      isPaused = false;

      currentZoom = 1;

      zoomSlider.value = "1";

      updateZoomDisplay();


      camera.style.display =
        "block";

      frozenImage.style.display =
        "none";

      zoomPanel.style.display =
        "block";

      cameraOffButton.style.display =
        "block";

      startButton.style.display =
        "none";

      cameraOffBottomButton.style.display =
        "block";

      pauseButton.style.display =
        "block";

      resumeButton.style.display =
        "none";


      status.textContent =
        "🟢 カメラ映像";

    }
    catch (err) {

      console.error(err);


      showError(
        "カメラを使用できませんでした。\n\n" +
        "Safariの設定でカメラへのアクセスを許可してください。"
      );

    }

  }


  /* =========================
     一時停止
     ========================= */

  function pauseCamera() {

    if (
      !stream ||
      !videoTrack ||
      isPaused
    ) {
      return;
    }


    const width =
      camera.videoWidth;

    const height =
      camera.videoHeight;


    if (
      width <= 0 ||
      height <= 0
    ) {

      return;

    }


    /*
     * Canvasに現在のカメラ映像をコピー
     */

    frozenImage.width =
      width;

    frozenImage.height =
      height;


    const ctx =
      frozenImage.getContext("2d");


    /*
     * 現在の映像をそのままコピー
     */

    ctx.drawImage(
      camera,
      0,
      0,
      width,
      height
    );


    /*
     * カメラ映像を停止
     */

    videoTrack.enabled =
      false;


    camera.style.display =
      "none";

    frozenImage.style.display =
      "block";


    /*
     * 一時停止時も
     * 現在のズーム倍率を維持
     */

    frozenImage.style.transform =
      "scale(" + currentZoom + ")";


    status.textContent =
      "⏸ 一時停止中";


    pauseButton.style.display =
      "none";

    resumeButton.style.display =
      "block";


    isPaused = true;

  }


  /* =========================
     再開
     ========================= */

  function resumeCamera() {

    if (
      !stream ||
      !videoTrack ||
      !isPaused
    ) {
      return;
    }


    videoTrack.enabled =
      true;


    frozenImage.style.display =
      "none";

    camera.style.display =
      "block";


    camera.style.transform =
      "scale(" + currentZoom + ")";


    status.textContent =
      "🟢 カメラ映像";


    pauseButton.style.display =
      "block";

    resumeButton.style.display =
      "none";


    isPaused = false;

  }


  /* =========================
     カメラを完全に切る
     ========================= */

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function (track) {
            track.stop();
          }
        );

    }


    stream = null;

    videoTrack = null;

    camera.srcObject = null;


    camera.style.display =
      "none";

    frozenImage.style.display =
      "none";


    zoomPanel.style.display =
      "none";

    cameraOffButton.style.display =
      "none";


    startButton.style.display =
      "block";

    cameraOffBottomButton.style.display =
      "none";

    pauseButton.style.display =
      "none";

    resumeButton.style.display =
      "none";


    currentZoom = 1;

    zoomSlider.value = "1";

    zoomValue.textContent =
      "1.0x";


    status.textContent =
      "カメラを開始してください";


    isPaused = false;

  }


  /* =========================
     ボタン
     ========================= */

  startButton.addEventListener(
    "click",
    startCamera
  );


  pauseButton.addEventListener(
    "click",
    pauseCamera
  );


  resumeButton.addEventListener(
    "click",
    resumeCamera
  );


  cameraOffButton.addEventListener(
    "click",
    stopCamera
  );


  cameraOffBottomButton.addEventListener(
    "click",
    stopCamera
  );


  /* =========================
     ページを離れたらカメラ停止
     ========================= */

  window.addEventListener(
    "pagehide",
    function () {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function (track) {
              track.stop();
            }
          );

      }

    }
  );

</script>

</body>
</html>
