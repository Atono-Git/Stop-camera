<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>カメラ一時停止</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow: hidden;
    }


    #app {

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: #000;
    }


    /* =================================
       カメラエリア
       ================================= */

    #cameraArea {

      position: relative;

      flex: 1;
      min-height: 0;

      background: #000;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    #camera {

      display: none;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }


    #frozenImage {

      display: none;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }


    /* =================================
       ステータス
       ================================= */

    #status {

      position: absolute;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      padding: 8px 15px;

      border-radius: 999px;

      background:
        rgba(0, 0, 0, 0.72);

      font-size: 14px;

      z-index: 50;

      white-space: nowrap;
    }


    /* =================================
       カメラOFF
       ================================= */

    #cameraOffButton {

      display: none;

      position: absolute;

      top: 15px;
      right: 15px;

      padding: 11px 15px;

      border: none;

      border-radius: 12px;

      background:
        rgba(25, 25, 25, 0.9);

      color: #fff;

      font-size: 15px;
      font-weight: 600;

      z-index: 50;

      cursor: pointer;
    }


    /* =================================
       縦型ズームパネル
       ================================= */

    #zoomPanel {

      display: none;

      position: absolute;

      left: 12px;

      top: 50%;

      transform: translateY(-50%);

      width: 64px;

      min-height: 310px;

      padding: 12px 8px;

      border-radius: 18px;

      background:
        rgba(15, 15, 15, 0.86);

      backdrop-filter: blur(10px);

      z-index: 40;

      display: none;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 8px;
    }


    #zoomTitle {

      font-size: 12px;

      color: #ccc;

      white-space: nowrap;
    }


    #zoomValue {

      font-size: 19px;

      font-weight: 700;

      white-space: nowrap;

      margin-bottom: 5px;
    }


    /*
     * 縦方向スライダー
     */

    #zoomSlider {

      appearance: slider-vertical;

      -webkit-appearance: slider-vertical;

      width: 32px;

      height: 190px;

      margin: 0;

      accent-color: #fff;

      cursor: pointer;
    }


    /*
     * Safariなどで
     * vertical sliderが使えない場合の保険
     */

    @supports not (
      appearance: slider-vertical
    ) {

      #zoomSlider {

        transform:
          rotate(-90deg);

        width: 190px;

        height: 32px;

        margin:
          80px 0;
      }

    }


    #zoomLabels {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: space-between;

      gap: 5px;

      color: #aaa;

      font-size: 10px;
    }


    /* =================================
       ズーム非対応表示
       ================================= */

    #zoomUnsupported {

      display: none;

      position: absolute;

      left: 90px;

      top: 50%;

      transform: translateY(-50%);

      max-width: 230px;

      padding: 10px 13px;

      border-radius: 10px;

      background:
        rgba(0, 0, 0, 0.8);

      color: #ddd;

      font-size: 12px;

      line-height: 1.5;

      z-index: 45;
    }


    /* =================================
       エラー
       ================================= */

    #error {

      display: none;

      position: absolute;

      left: 20px;
      right: 20px;

      top: 50%;

      transform: translateY(-50%);

      padding: 20px;

      border-radius: 14px;

      background: #222;

      color: #fff;

      text-align: center;

      line-height: 1.6;

      white-space: pre-line;

      z-index: 100;
    }


    /* =================================
       下部操作
       ================================= */

    #controls {

      flex-shrink: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      padding: 12px;

      padding-bottom:
        calc(12px + env(safe-area-inset-bottom));

      background: #111;
    }


    button {

      min-height: 52px;

      padding: 10px 18px;

      border: none;

      border-radius: 14px;

      color: #fff;

      background: #292929;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    button:active {

      transform: scale(0.97);
    }


    #startButton {

      background: #16a34a;

      min-width: 200px;
    }


    #pauseButton {

      display: none;

      background: #2563eb;

      flex: 1;

      max-width: 240px;
    }


    #resumeButton {

      display: none;

      background: #2563eb;

      flex: 1;

      max-width: 240px;
    }


    #cameraOffBottomButton {

      display: none;

      background: #333;

      flex: 1;

      max-width: 180px;
    }


    /* =================================
       下部説明
       ================================= */

    #info {

      flex-shrink: 0;

      display: flex;

      justify-content: space-between;

      gap: 12px;

      padding: 8px 15px;

      background: #000;

      border-top: 1px solid #333;

      color: #aaa;

      font-size: 12px;
    }


    #info span {

      white-space: nowrap;
    }


    /* =================================
       スマホ
       ================================= */

    @media (max-width: 600px) {

      #zoomPanel {

        left: 8px;

        width: 58px;

        min-height: 290px;
      }


      #zoomSlider {

        height: 175px;
      }


      #cameraOffButton {

        top: 12px;
        right: 12px;

        font-size: 14px;

        padding: 10px 13px;
      }


      #controls {

        gap: 7px;

        padding-left: 8px;
        padding-right: 8px;
      }


      button {

        font-size: 14px;

        padding-left: 10px;
        padding-right: 10px;
      }


      #info {

        font-size: 10px;

        padding-left: 10px;
        padding-right: 10px;
      }

    }

  </style>

</head>


<body>


<div id="app">


  <!-- =================================
       カメラ表示
       ================================= -->

  <div id="cameraArea">


    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>


    <canvas
      id="frozenImage"
    ></canvas>


    <div id="status">
      カメラを開始してください
    </div>


    <button
      id="cameraOffButton"
      type="button"
    >
      ⛔ カメラを切る
    </button>


    <!-- =================================
         縦ズーム
         ================================= -->

    <div id="zoomPanel">

      <div id="zoomTitle">
        🔍 ズーム
      </div>


      <div id="zoomValue">
        1.0x
      </div>


      <input
        id="zoomSlider"
        type="range"
        min="1"
        max="5"
        step="0.1"
        value="1"
        aria-label="カメラズーム"
      >


      <div id="zoomLabels">

        <span>5x</span>

        <span>4x</span>

        <span>3x</span>

        <span>2x</span>

        <span>1x</span>

      </div>

    </div>


    <div id="zoomUnsupported">
      この端末・ブラウザではカメラのズーム機能を利用できません。
    </div>


    <div id="error"></div>


  </div>


  <!-- =================================
       操作ボタン
       ================================= -->

  <div id="controls">


    <button
      id="startButton"
      type="button"
    >
      📷 カメラ開始
    </button>


    <button
      id="cameraOffBottomButton"
      type="button"
    >
      ⛔ カメラを切る
    </button>


    <button
      id="pauseButton"
      type="button"
    >
      ⏸ 一時停止
    </button>


    <button
      id="resumeButton"
      type="button"
    >
      ▶ 再開
    </button>


  </div>


  <!-- =================================
       説明
       ================================= -->

  <div id="info">

    <span>
      🎤 マイクにはアクセスしていません
    </span>

    <span>
      🔒 写真は保存されません
    </span>

  </div>


</div>


<script>


  /* =================================
     要素
     ================================= */

  const camera =
    document.getElementById("camera");

  const frozenImage =
    document.getElementById("frozenImage");

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");

  const startButton =
    document.getElementById("startButton");

  const cameraOffButton =
    document.getElementById("cameraOffButton");

  const cameraOffBottomButton =
    document.getElementById(
      "cameraOffBottomButton"
    );

  const pauseButton =
    document.getElementById("pauseButton");

  const resumeButton =
    document.getElementById("resumeButton");

  const zoomPanel =
    document.getElementById("zoomPanel");

  const zoomSlider =
    document.getElementById("zoomSlider");

  const zoomValue =
    document.getElementById("zoomValue");

  const zoomUnsupported =
    document.getElementById(
      "zoomUnsupported"
    );


  /* =================================
     状態
     ================================= */

  let stream = null;

  let videoTrack = null;

  let isPaused = false;

  let zoomSupported = false;

  let zoomMinimum = 1;

  let zoomMaximum = 1;


  /* =================================
     エラー
     ================================= */

  function showError(message) {

    error.textContent =
      message;

    error.style.display =
      "block";
  }


  function hideError() {

    error.style.display =
      "none";
  }


  /* =================================
     ズーム性能を調べる
     ================================= */

  function detectZoom() {

    zoomSupported = false;

    zoomMinimum = 1;

    zoomMaximum = 1;


    if (!videoTrack) {
      return;
    }


    try {

      const capabilities =
        videoTrack.getCapabilities();


      /*
       * カメラ側のズームAPI
       */

      if (
        capabilities.zoom &&
        typeof capabilities.zoom.min ===
          "number" &&
        typeof capabilities.zoom.max ===
          "number"
      ) {

        zoomMinimum =
          capabilities.zoom.min;

        zoomMaximum =
          Math.min(
            capabilities.zoom.max,
            5
          );


        /*
         * 1倍以上、5倍以下で
         * 実際に使える範囲があるか確認
         */

        if (
          zoomMaximum >
            zoomMinimum
        ) {

          zoomSupported = true;

        }

      }

    }
    catch (err) {

      console.log(
        "ズーム情報を取得できませんでした",
        err
      );

    }


    if (zoomSupported) {

      zoomPanel.style.display =
        "flex";

      zoomUnsupported.style.display =
        "none";


      zoomSlider.min =
        String(
          Math.max(
            1,
            zoomMinimum
          )
        );


      zoomSlider.max =
        String(
          Math.min(
            5,
            zoomMaximum
          )
        );


      /*
       * 1倍スタート
       */

      zoomSlider.value =
        String(
          Math.max(
            1,
            zoomMinimum
          )
        );


      updateZoomText();

    }
    else {

      zoomPanel.style.display =
        "none";

      zoomUnsupported.style.display =
        "block";

    }

  }


  /* =================================
     ズーム倍率表示
     ================================= */

  function updateZoomText() {

    const value =
      Number(
        zoomSlider.value
      );


    if (
      !Number.isFinite(value)
    ) {
      return;
    }


    zoomValue.textContent =
      value.toFixed(1) + "x";

  }


  /* =================================
     カメラ側のズームを変更
     ================================= */

  async function changeZoom(value) {

    if (
      !videoTrack ||
      !zoomSupported
    ) {
      return;
    }


    let zoom =
      Number(value);


    if (
      !Number.isFinite(zoom)
    ) {

      zoom =
        zoomMinimum;

    }


    zoom =
      Math.max(
        zoomMinimum,
        Math.min(
          zoomMaximum,
          zoom
        )
      );


    zoomSlider.value =
      String(zoom);


    updateZoomText();


    try {

      /*
       * ここでカメラ本体に
       * ズーム倍率を指定する。
       */

      await videoTrack.applyConstraints({

        advanced: [
          {
            zoom: zoom
          }
        ]

      });

    }
    catch (err) {

      console.error(
        "カメラズームに失敗:",
        err
      );

    }

  }


  /* =================================
     スライダー
     ================================= */

  zoomSlider.addEventListener(
    "input",
    function () {

      changeZoom(
        this.value
      );

    }
  );


  /* =================================
     カメラ開始
     ================================= */

  async function startCamera() {

    hideError();


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showError(
        "このブラウザではカメラを使用できません。"
      );

      return;
    }


    try {

      /*
       * videoだけ取得。
       *
       * audio:false
       *
       * マイクは使用しない。
       */

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }

          },

          audio: false

        });


      camera.srcObject =
        stream;


      await camera.play();


      videoTrack =
        stream.getVideoTracks()[0];


      /*
       * カメラのズーム性能を確認
       */

      detectZoom();


      /*
       * 連続オートフォーカスを
       * カメラが対応していれば使用
       */

      try {

        const capabilities =
          videoTrack.getCapabilities();


        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes(
            "continuous"
          )
        ) {

          await videoTrack.applyConstraints({

            advanced: [
              {
                focusMode:
                  "continuous"
              }
            ]

          });

        }

      }
      catch (err) {

        console.log(
          "オートフォーカス設定非対応"
        );

      }


      /* =========================
         UI
         ========================= */

      camera.style.display =
        "block";

      frozenImage.style.display =
        "none";

      startButton.style.display =
        "none";

      cameraOffButton.style.display =
        "block";

      cameraOffBottomButton.style.display =
        "block";

      pauseButton.style.display =
        "block";

      resumeButton.style.display =
        "none";


      isPaused = false;


      status.textContent =
        "🟢 カメラ映像";

    }
    catch (err) {

      console.error(err);


      showError(
        "カメラを使用できませんでした。\n\n" +
        "Safariなどのブラウザでカメラの許可を確認してください。"
      );

    }

  }


  /* =================================
     一時停止
     ================================= */

  function pauseCamera() {

    if (
      !stream ||
      !videoTrack ||
      isPaused
    ) {

      return;

    }


    const width =
      camera.videoWidth;

    const height =
      camera.videoHeight;


    if (
      width <= 0 ||
      height <= 0
    ) {

      return;

    }


    /*
     * 現在の映像をCanvasへコピー
     */

    frozenImage.width =
      width;

    frozenImage.height =
      height;


    const ctx =
      frozenImage.getContext("2d");


    ctx.drawImage(
      camera,
      0,
      0,
      width,
      height
    );


    /*
     * カメラ映像停止
     */

    videoTrack.enabled =
      false;


    camera.style.display =
      "none";

    frozenImage.style.display =
      "block";


    status.textContent =
      "⏸ 一時停止中";


    pauseButton.style.display =
      "none";

    resumeButton.style.display =
      "block";


    isPaused = true;

  }


  /* =================================
     再開
     ================================= */

  function resumeCamera() {

    if (
      !stream ||
      !videoTrack ||
      !isPaused
    ) {

      return;

    }


    videoTrack.enabled =
      true;


    frozenImage.style.display =
      "none";

    camera.style.display =
      "block";


    status.textContent =
      "🟢 カメラ映像";


    pauseButton.style.display =
      "block";

    resumeButton.style.display =
      "none";


    isPaused = false;

  }


  /* =================================
     カメラ完全停止
     ================================= */

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function (track) {

            track.stop();

          }
        );

    }


    stream = null;

    videoTrack = null;

    isPaused = false;


    camera.srcObject =
      null;


    camera.style.display =
      "none";

    frozenImage.style.display =
      "none";


    zoomPanel.style.display =
      "none";

    zoomUnsupported.style.display =
      "none";


    cameraOffButton.style.display =
      "none";


    startButton.style.display =
      "block";

    cameraOffBottomButton.style.display =
      "none";

    pauseButton.style.display =
      "none";

    resumeButton.style.display =
      "none";


    zoomSlider.value =
      "1";

    zoomValue.textContent =
      "1.0x";


    status.textContent =
      "カメラを開始してください";

  }


  /* =================================
     ボタン
     ================================= */

  startButton.addEventListener(
    "click",
    startCamera
  );


  pauseButton.addEventListener(
    "click",
    pauseCamera
  );


  resumeButton.addEventListener(
    "click",
    resumeCamera
  );


  cameraOffButton.addEventListener(
    "click",
    stopCamera
  );


  cameraOffBottomButton.addEventListener(
    "click",
    stopCamera
  );


  /* =================================
     ページを離れたらカメラ停止
     ================================= */

  window.addEventListener(
    "pagehide",
    function () {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function (track) {

              track.stop();

            }
          );

      }

    }
  );


</script>


</body>
</html>
